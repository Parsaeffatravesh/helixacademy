<style>
:root{color-scheme:light;--ink:#233047;--muted:#8290a5;--line:#dfe6f0;--blue:#496bcc;--green:#168c6e;--red:#bf5968;--paper:#fff;--bg:#f3f6fa;--round:20px;--ease:cubic-bezier(.2,.82,.22,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:#e7edf5;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}button{font:inherit}button, [role="button"]{cursor:pointer}button:focus-visible,[role="button"]:focus-visible{outline:3px solid #87a7ff;outline-offset:3px}
#app{height:100vh;height:100dvh;min-height:0;max-width:650px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg);margin:auto;isolation:isolate;box-shadow:0 0 55px #263f6925}
header{flex:none;height:58px;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:0 15px;padding-top:env(safe-area-inset-top,0px);position:relative;z-index:6}header .hgroup{display:flex;gap:9px;align-items:center;min-width:0}.logo{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#273b61;color:#fff;font-size:17px;font-weight:900;letter-spacing:-2px;box-shadow:0 6px 13px #253d6d21}.brand{font-size:13px;font-weight:900;letter-spacing:.1em;direction:ltr}.eyebrow{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.045em}.h-actions{display:flex;gap:6px;align-items:center}.tiny{height:38px;min-width:38px;border:1px solid #e3eaf2;border-radius:12px;background:#fff8;color:#6c7e97;display:grid;place-items:center;padding:0 9px;font-size:17px}.level{font-size:11px;color:#7c8ba2;font-weight:800;direction:ltr;min-width:51px;text-align:center}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 48% 42%,#ffffff 2%,#edf3fb 55%,#e5edf8 100%)}
.viewport::before{content:"";position:absolute;inset:0;opacity:.38;pointer-events:none;background-image:linear-gradient(#91a3c512 1px,transparent 1px),linear-gradient(90deg,#91a3c512 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse,black 15%,transparent 80%);z-index:0}
.scene{position:absolute;inset:0;transition:opacity .42s var(--ease),transform .52s var(--ease);opacity:0;pointer-events:none;transform:translateX(-9%) scale(.985);z-index:1}.scene.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;z-index:2}.scene.exiting{transform:translateX(9%) scale(.985)}svg.playfield{display:block;width:100%;height:100%;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.scene-titles{position:absolute;top:11px;left:12px;right:12px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}.scene-pill{border:1px solid #e1e8f3;background:#ffffffee;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:850;white-space:nowrap;box-shadow:0 6px 22px #52749b0b;color:#52647f;max-width:100%;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.prompt{position:absolute;left:11px;right:11px;bottom:8px;z-index:4;display:flex;justify-content:center;pointer-events:none}.prompt>span{display:block;max-width:98%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fffE;border:1px solid #dfe6f0;border-radius:999px;padding:7px 12px;font-size:10px;color:#61748c;font-weight:650;box-shadow:0 5px 15px #5472950d}
#stage{opacity:.99}#workshop .sparkline{stroke-dasharray:6 9;animation:lineFlow 1.5s linear infinite}@keyframes lineFlow{to{stroke-dashoffset:-30}}.interactive{cursor:pointer;outline:none;touch-action:none}.interactive:focus-visible .focus-ring{stroke:#6080dd;stroke-width:3;opacity:1}.interactive .focus-ring{stroke:transparent;opacity:0}.interactive:hover .hover-outline{opacity:.9}.hover-outline{opacity:0;transition:opacity .2s}.hot .pulse-ring{animation:pulse 2.3s ease-in-out infinite}.pulse-ring{transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.38;transform:scale(1)}55%{opacity:.95;transform:scale(1.065)}}.entering{animation:arrive .55s var(--ease) both}@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.particle{offset-rotate:0deg;animation:floatmotion 3s ease-in-out infinite alternate}@keyframes floatmotion{from{opacity:.45;transform:translateY(0)}to{opacity:1;transform:translateY(-6px)}}
#stage [data-part]{opacity:0;pointer-events:none;transition:opacity .33s ease,transform .4s var(--ease)}#stage [data-part].visible{opacity:1;pointer-events:auto}#stage [data-part="image"]{transform:translateY(18px)}#stage [data-part="image"].visible{transform:translateY(0)}#stage [data-part="storage"]{transform:translateY(12px)}#stage [data-part="storage"].visible{transform:translateY(0)}#stage [data-part="db"]{transform:scale(.92);transform-origin:50% 66%}#stage [data-part="db"].visible{transform:scale(1)}
#workshop[data-phase="win"] .completion-rays{opacity:1} .completion-rays{opacity:0;transition:opacity .8s;pointer-events:none}
#workshop .hit{fill:transparent;stroke:transparent;stroke-width:2}#workshop .outlet{transition:opacity .2s}#world-scene .world-node{transition:filter .2s,opacity .2s}
#dock{position:relative;z-index:7;flex:none;min-height:107px;padding:11px 15px calc(10px + env(safe-area-inset-bottom,0px));background:#fffffff0;border-top:1px solid #e7ebf2;box-shadow:0 -6px 28px #58759a08;display:flex;flex-direction:column;gap:10px;justify-content:center}#dock-top{display:flex;align-items:center;gap:11px;min-height:43px}#dock-icon{width:39px;height:39px;flex:none;border-radius:13px;background:#edf3ff;color:#526cb9;display:grid;place-items:center;font-size:19px}#dock-copy{flex:1;min-width:0}#dock-title{font-size:14px;font-weight:850;line-height:1.4;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}#dock-sub{font-size:11px;color:#7d8b9d;line-height:1.6;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-top:3px}#dock-controls{display:flex;gap:8px;min-height:38px}.pillbtn{border:1px solid #e2e8f2;color:#62738c;background:#f5f8fb;border-radius:12px;padding:7px 12px;font-size:11px;font-weight:800;min-height:38px;display:flex;align-items:center;justify-content:center;gap:6px}.pillbtn.primary{border-color:#5172cd;background:#5172cd;color:white;box-shadow:0 7px 15px #4b6bc12b;flex:1}.pillbtn.secondary{background:white}.pillbtn:active,.tiny:active{transform:scale(.97)}#dock .steps{display:flex;gap:5px;align-items:center;direction:ltr;flex:1;padding:0 2px}.steps i{background:#e3e9f1;border-radius:6px;height:4px;flex:1;transition:background .22s}.steps i.done{background:#2aa481}.steps i.current{background:#597add}
#flash{position:absolute;left:50%;transform:translateX(-50%) translateY(12px);bottom:calc(124px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:800;background:#283b57eb;color:#fff;padding:9px 15px;border-radius:999px;z-index:20;opacity:0;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s,transform .25s;box-shadow:0 10px 28px #20334a26}#flash.show{opacity:1;transform:translateX(-50%) translateY(0)}#flash.error{background:#a44756ee}
#sheet{position:absolute;inset:0;background:#1b304a53;z-index:30;pointer-events:none;opacity:0;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center;padding:0 9px calc(9px + env(safe-area-inset-bottom,0px))}#sheet.open{pointer-events:auto;opacity:1}#sheet-card{background:white;border:1px solid #e6eaf2;border-radius:23px;width:100%;max-width:610px;padding:16px 17px 17px;max-height:75dvh;overflow:auto;transform:translateY(15px);transition:transform .28s var(--ease)}#sheet.open #sheet-card{transform:translateY(0)}#sheet-title{margin:0;font-size:16px}#sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}#sheet-body{font-size:13px;color:#556780;line-height:1.9}#sheet-body p{margin:0 0 9px}#sheet-body code,#sheet-body pre{display:block;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #e5eaf2;background:#f5f8fc;color:#41546d;font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px;border-radius:13px}#sheet-body .symbol-row{display:flex;gap:8px;align-items:center;border:1px solid #ecf0f5;border-radius:12px;padding:8px;margin:7px 0}#sheet-body .symbol-row b{background:#eaf0fb;border-radius:9px;padding:6px 9px;color:#4867a4}.sheet-close{border:none;color:#51657f;border-radius:10px;background:#eef3f8;width:34px;height:34px;font-size:21px;display:grid;place-items:center}
#drag-ghost{position:absolute;pointer-events:none;z-index:20;width:62px;height:62px;display:none;align-items:center;justify-content:center;border:2px solid #6888d8;border-radius:17px;background:#ebf2ffdf;color:#4665af;font-size:25px;font-weight:900;box-shadow:0 9px 27px #466cc13d;transform:translate(-50%,-50%) rotate(-5deg)}#drag-ghost.show{display:flex}
@media(max-height:680px){header{height:47px}.logo{width:27px;height:27px;border-radius:9px;font-size:14px}.brand{font-size:11px}.tiny{height:34px;min-width:34px;border-radius:10px}#dock{min-height:91px;padding:7px 12px calc(5px + env(safe-area-inset-bottom,0px));gap:5px}#dock-icon{height:30px;width:30px;font-size:16px;border-radius:9px}#dock-top{min-height:31px}#dock-title{font-size:12px}#dock-sub{font-size:10px}.pillbtn{min-height:32px;padding:4px 8px;font-size:10px}#dock-controls{min-height:32px}.scene-titles{top:7px}.scene-pill{font-size:10px;padding:5px 11px}.prompt{bottom:3px}.prompt>span{font-size:9px;padding:4px 9px}#flash{bottom:105px}}
@media(max-width:335px){.brand{font-size:10px;letter-spacing:.055em}.level{min-width:38px;font-size:10px}header{gap:5px;padding-inline:10px}.h-actions{gap:3px}#dock-sub{font-size:10px}.pillbtn{padding-inline:7px}.scene-pill{max-width:98%}}
@media(min-width:700px){#app{max-width:760px}.scene-titles{top:18px}#dock{min-height:115px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* V9.6: Nginx Routing Puzzle. The network view has a stable DOM and its own interaction model. */
#network{--net:#496fcc}#installedImage,#installedImage *,#diskConnection,#diskConnection *,#diskConnectionTemp,#diskConnectionTemp *{pointer-events:none!important}#network .netcard{fill:#fff;stroke:#d9e3f0;stroke-width:1.8}#network .nettarget{cursor:pointer;touch-action:manipulation;outline:none}#network .nettarget:focus-visible .netoutline{stroke:#5279da;stroke-width:3;opacity:1}#network .netoutline{fill:none;stroke:transparent;stroke-width:3;opacity:0}#network .net-path{stroke:#bbcadd;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:6 9;animation:lineFlow 1.8s linear infinite;transition:stroke .27s,opacity .27s}#network .net-path.live{stroke:#3bad8c}#network .net-path.bad{stroke:#cc7b88}#network .port-target rect.socket-bg{fill:#f9fbfe;stroke:#d4dfed;stroke-width:1.8;transition:fill .25s,stroke .25s}#network .port-target.chosen rect.socket-bg{fill:#e9f1ff;stroke:#557bd4;stroke-width:2.7}#network .port-target.chosen.good rect.socket-bg{fill:#e7f8f0;stroke:#34a986}#network .route-row{transition:opacity .2s}#network .net-switch{transition:fill .25s,stroke .25s}#network .nettarget[aria-disabled=true]{opacity:.38;cursor:default}#network .probe-flash{animation:arrive .42s var(--ease) both}#netPacket{pointer-events:none;filter:drop-shadow(0 3px 5px #426bae40)}#network .led{transition:fill .3s}#network .net-hot{animation:pulse 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* V9.7 · A different activity: controlled experiments, not component placement or routing. */
#metrics .labcontrol{cursor:pointer;outline:none;touch-action:manipulation}
#metrics .labcontrol:focus-visible .labfocus{stroke:#5176d7;stroke-width:3;opacity:1}
#metrics .labfocus{fill:none;stroke:transparent;opacity:0}
#metrics .labcard{fill:#fff;stroke:#dfe8f3;stroke-width:1.6}
#metrics .labvalue{font-variant-numeric:tabular-nums;direction:ltr}
#metrics .labchip{transition:fill .22s,stroke .22s}
#metrics #labSlideThumb{transition:cx .11s ease;filter:drop-shadow(0px 2px 3px #51698733)}
#metrics .labmain,#metrics .labscope{transition:opacity .25s ease, transform .3s cubic-bezier(.2,.82,.22,1);transform-origin:50% 50%}
#metrics .labmain.inactive,#metrics .labscope.inactive{opacity:0;transform:translateY(9px);pointer-events:none;visibility:hidden}
#metrics .labresult{transition:fill .22s,stroke .22s}
#metrics .labbeacon{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#metrics .scope-point{cursor:pointer;touch-action:manipulation}
#metrics .scope-point:focus-visible circle{stroke:#496bcc;stroke-width:4}
#metrics .scope-graph{fill:none;stroke:#5578d3;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#metrics .scope-graph-fill{fill:#6d97d3;opacity:.1}
#metrics .lab-button-fill{transition:fill .25s}
@media(prefers-reduced-motion:reduce){#metrics #labSlideThumb,#metrics .labmain,#metrics .labscope{transition:none!important}}

/* V9.8: Time-machine collector. Persistent SVG; visual state updated incrementally. */
#prometheus .pcard{fill:#fff;stroke:#dce6f2;stroke-width:1.7}
#prometheus .p-hit{cursor:pointer;touch-action:manipulation;outline:none}
#prometheus .p-hit:focus-visible .p-focus{stroke:#4d75c9;stroke-width:3;opacity:1}
#prometheus .p-focus{stroke:transparent;fill:none;opacity:0}
#prometheus .p-lane{fill:none;stroke:#b9c9e4;stroke-width:3;stroke-dasharray:6 7;transition:stroke .25s}
#prometheus .p-lane.up{stroke:#42b993;animation:lineFlow 1.4s linear infinite}
#prometheus .p-led{transition:fill .2s}
#prometheus .p-timebar{transition:width .32s cubic-bezier(.22,.9,.3,1)}
#prometheus .p-cell{cursor:pointer;touch-action:manipulation;outline:none}
#prometheus .p-cell:focus-visible .p-ring{stroke:#496bcc;stroke-width:3}
#prometheus .p-cell .p-ring{stroke:#dbe4f1;stroke-width:1.3}
#prometheus #pPacket{transition:opacity .16s}
#prometheus .p-step{transition:stroke .2s}
#prometheus .p-pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){#prometheus .p-lane.up{animation:none!important}}

#grafana .gf-hit{cursor:pointer;touch-action:manipulation;outline:none}
#grafana .gf-hit:focus-visible rect{stroke:#5277dc;stroke-width:3}
#grafana .gf-graph{transition:opacity .24s}
#grafana .gf-panel-outline{transition:stroke .2s,fill .2s}
#grafana .gf-dot{animation:gfPulse 2.5s ease-in-out infinite}
@keyframes gfPulse{50%{opacity:.48}}
@media(prefers-reduced-motion:reduce){#grafana .gf-dot{animation:none}}
</style>
</head>

 <section class="scene" id="workshop" aria-label="کارگاه Docker">

   <defs>
    <linearGradient id="rackSide" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#526c93"/><stop offset="1" stop-color="#293f60"/></linearGradient>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const STORE='helix.quest.v95.workshop.1';
const BASE=()=>({image:false,storage:null,db:false,running:false,healthy:false,record:false,recreated:false,postHealth:false,verified:false,loss:false,won:false,mistakes:0,hintTier:0,visited:false,events:[]});
const safe={load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x||x.schema!==1)return BASE();const o={...BASE(),...x};o.events=Array.isArray(o.events)?o.events.slice(-35):[];return o}catch{return BASE()}},save(o){try{localStorage.setItem(STORE,JSON.stringify({...o,schema:1}))}catch{}}};
let game={scene:'hub',data:safe.load(),busy:false,pendingDrag:null,selectedTool:null,lastPhase:'',inputTime:0};
const NETSTORE='helix.quest.v96.network.1';
const NETBASE=()=>({dns:false,tls:false,upgrade:false,routes:{web:null,api:null,ws:null},tests:{web:false,api:false,ws:false},result:{web:null,api:null,ws:null},seenFailure:null,repaired:false,won:false,mastered:false,attempts:0,events:[],hint:0});
function netLoad(){try{const raw=JSON.parse(localStorage.getItem(NETSTORE)||'null');if(!raw||raw.schema!==1)return NETBASE();return {...NETBASE(),...raw,routes:{...NETBASE().routes,...raw.routes},tests:{...NETBASE().tests,...raw.tests},result:{...NETBASE().result,...raw.result},events:Array.isArray(raw.events)?raw.events.slice(-25):[]}}catch{return NETBASE()}}
const network={data:netLoad(),packetToken:0,animating:false};
function netSave(){try{localStorage.setItem(NETSTORE,JSON.stringify({...network.data,schema:1}))}catch{}}
function netEvent(message){network.data.events.push(`${timeStamp()} ${message}`);network.data.events=network.data.events.slice(-25);netSave()}
function netOnline(){let n=network.data;return !!(game.data.won&&n.dns&&n.tls&&n.upgrade&&Object.values(n.routes).every(v=>v===8000))}
const scenes={hub:$('world-scene'),workshop:$('workshop'),network:$('network'),metrics:$('metrics'),prometheus:$('prometheus'),grafana:$('grafana')};
function now(){return (typeof performance!=='undefined'?performance.now():Date.now())}
function recordEvent(name){game.data.events.push(name);game.data.events=game.data.events.slice(-35);safe.save(game.data)}
function timeStamp(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function vibrate(n=9){try{navigator.vibrate?.(n)}catch{}}
let toasty;
function toast(str,error=false){const el=$('flash');el.textContent=str;el.classList.toggle('error',error);el.classList.add('show');clearTimeout(toasty);toasty=setTimeout(()=>el.classList.remove('show'),2000)}
function phase(){const s=game.data;if(s.won)return 'win';if(s.loss)return 'lost';if(!s.image)return 'image';if(!s.storage)return 'storage';if(!s.db)return 'db';if(!s.running)return 'power';if(!s.healthy)return s.recreated?'post-health':'health';if(!s.record)return 'record';if(!s.recreated)return 'recreate';if(!s.postHealth)return 'post-health';return 'verify'}
const guidance={
 image:['بستهٔ HELIX را وارد Docker کن','بسته را بکش یا دو بار لمس کن.','◫','نصب بسته'],
 storage:['اطلاعات کجا نگه‌داری شوند؟','دو مخزن را امتحان کن.','◈','انتخاب دیسک'],
 db:['پایگاه‌داده را آماده کن','نماد دیتابیس را لمس کن.','▤','ایجاد دیتابیس'],
 power:['HELIX را روشن کن','کلید روشن‌کردن روی سرور.','⏻','اجرای کانتینر'],
 health:['سالم بودن را آزمایش کن','نبض سرور را لمس کن.','♡','Health check'],
 record:['یک داده در HELIX ثبت کن','کارت 01 را داخل برنامه بفرست.','▣','ثبت داده'],
 recreate:['کانتینر را از نو بساز','چرخش بازسازی را لمس کن.','↻','بازسازی کانتینر'],
 'post-health':['کانتینر جدید سالم است؟','آزمون سلامت را دوباره اجرا کن.','♡','Health check مجدد'],
 verify:['داده هنوز وجود دارد؟','مخزن پایدار را بررسی کن.','⌁','بررسی داده'],
 lost:['داده آزمایشی از بین رفت','با دیسک دائمی دوباره امتحان کن.','!','بازیابی'],
 win:['آفرین، HELIX سالم است','داده بعد از بازسازی باقی ماند.','✓','مأموریت کامل']
};
function setVisible(id,bool){const e=$(id);if(e){e.style.opacity=bool?'1':'0';e.style.pointerEvents=bool?'auto':'none'}}

// V9.7: a separate experiential laboratory powered by the shared HELIX/network state.
const LABKEY='helix.quest.v97.metrics.1';
const LABBASE=()=>({load:1,http:0,success:0,errors:0,wsOpen:false,everWS:false,latency:0,samples:[],lowDone:false,highDone:false,errorDone:false,lowInspected:false,highInspected:false,healthChecked:false,healthResult:null,access:{good:false,noToken:false,public:false},scope:false,point:null,won:false,log:[],hint:0});
function labLoad(){try{const x=JSON.parse(localStorage.getItem(LABKEY)||'null');if(!x||x.schema!==1)return LABBASE();return {...LABBASE(),...x,access:{...LABBASE().access,...x.access},samples:Array.isArray(x.samples)?x.samples.slice(-16):[],log:Array.isArray(x.log)?x.log.slice(-30):[]}}catch{return LABBASE()}}
const lab={data:labLoad(),animating:false,token:0,slider:null};
function labSave(){try{localStorage.setItem(LABKEY,JSON.stringify({...lab.data,schema:1}))}catch{}}
function labEvent(s){lab.data.log.push(`${timeStamp()} ${s}`);lab.data.log=lab.data.log.slice(-30);labSave()}
function labAvailable(){return !!(game.data.running&&game.data.healthy&&netOnline()&&network.data.won)}
function labComplete(){const m=lab.data;const a=m.access;return m.lowDone&&m.highDone&&m.errorDone&&m.everWS&&m.lowInspected&&m.highInspected&&m.healthChecked&&a.good&&a.noToken&&a.public}
function labProgress(){const m=lab.data;return [m.lowDone,m.highDone,m.errorDone,m.everWS,m.lowInspected&&m.highInspected,m.healthChecked,m.access.good&&m.access.noToken&&m.access.public]}
function labCopy(){const m=lab.data;if(!labAvailable())return ['ارتباط HELIX قطع است','وضعیت Docker و Nginx را بررسی کن.'];if(m.won)return ['آزمایشگاه Metrics کامل شد','HTTP · 5XX · latency · access'];if(!m.lowDone)return ['یک درخواست کم‌بار بفرست','بار را روی 1 قرار بده و 200 را لمس کن.'];if(!m.highDone)return ['بار را بیشتر کن','اسلایدر را روی 8 ببر و 200 را آزمایش کن.'];if(!m.errorDone)return ['عمداً خطای 500 بساز','500 را لمس کن؛ Health هنوز می‌تواند 200 باشد.'];if(!m.everWS)return ['یک ارتباط زنده باز کن','LIVE / WS را لمس کن و سپس ببند.'];if(!m.lowInspected||!m.highInspected)return ['دو نمونه را مقایسه کن','به بازرسی داده برو و نقاط کم‌بار و پربار را لمس کن.'];if(!m.healthChecked)return ['آیا برنامه سالم است؟','در نمای بازرسی، Health Check را جدا امتحان کن.'];return ['چه کسی به Metrics دسترسی دارد؟','سه درخواست دسترسی را در نمای بازرسی آزمایش کن.']}
function labSetLoad(v){const m=lab.data;m.load=[1,4,8].reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a,1);labUpdateSlider();labSave()}
function labUpdateSlider(){const m=lab.data;const x=61+278*(m.load-1)/7;$('labSlideThumb').setAttribute('cx',x);$('labSliderFill').setAttribute('d',`M61 342 H${x}`);$('labLoadLabel').textContent=m.load+' req';$('labSlider').setAttribute('aria-valuenow',String(m.load));}
function labScopeView(which){lab.data.scope=which;$('labMain').classList.toggle('inactive',which);$('labScope').classList.toggle('inactive',!which);$('labMain').setAttribute('visibility',which?'hidden':'visible');$('labScope').setAttribute('visibility',which?'visible':'hidden');labSave();labSync();}
function labTrafficAnimation(bad){const layer=$('labParticleLayer'),token=++lab.token;const points=bad?[[65,122],[131,122],[200,121],[264,121],[320,121]]:[[65,122],[130,122],[201,121],[260,121],[321,121]];const node=document.createElementNS('http://www.w3.org/2000/svg','circle');node.setAttribute('r','8');node.setAttribute('fill',bad?'#c86778':'#37b28e');node.setAttribute('stroke','#fff');node.setAttribute('stroke-width','2');layer.appendChild(node);const start=performance.now();const dur=520;function step(t){if(token!==lab.token||game.scene!=='metrics'||lab.data.scope){node.remove();return}const f=Math.min(1,(t-start)/dur),pos=f*(points.length-1),i=Math.min(points.length-2,Math.floor(pos)),v=pos-i;node.setAttribute('cx',points[i][0]+(points[i+1][0]-points[i][0])*v);node.setAttribute('cy',points[i][1]+(points[i+1][1]-points[i][1])*v);if(f<1)requestAnimationFrame(step);else node.remove()}requestAnimationFrame(step)}
function labGenerate(bad){if(!labAvailable()){toast('HELIX آنلاین نیست؛ شبکه را بررسی کن',true);return}const m=lab.data,load=m.load;if(m.scope)labScopeView(false);let errors=bad?Math.max(1,Math.floor(load/3)):0;let success=load-errors;const latency= Math.round(65+load*42+(bad?errors*95:0)+(m.samples.length%3)*8);m.http+=load;m.success+=success;m.errors+=errors;m.latency=latency;const sample={load,http:m.http,success:m.success,errors:m.errors,increment:load,failed:errors,latency,id:Date.now()};m.samples.push(sample);m.samples=m.samples.slice(-16);if(!bad&&load===1)m.lowDone=true;if(load===8)m.highDone=true;if(bad)m.errorDone=true;m.point=m.samples.length-1;labEvent(`GET /synthetic?load=${load} -> ${success} x 200, ${errors} x 500; response ${latency}ms (simulated)`);labTrafficAnimation(bad);toast(`${load} درخواست · ${errors} خطا · ${latency}ms`,bad);vibrate(bad?15:8);labSync();render()}
function labSocket(){if(!labAvailable()){toast('WebSocket نیاز به شبکهٔ سالم دارد',true);return}const m=lab.data;m.wsOpen=!m.wsOpen;if(m.wsOpen)m.everWS=true;labEvent(`ws connection ${m.wsOpen?'open':'closed'} /ws [synthetic]`);toast(m.wsOpen?'LIVE وصل شد':'LIVE قطع شد');vibrate(8);render()}
function labSelectPoint(index){const m=lab.data;const s=m.samples[index];if(!s)return;m.point=index;if(s.load===1&&!s.failed)m.lowInspected=true;if(s.load===8)m.highInspected=true;labEvent(`inspected sample ${index+1}: load=${s.load} latency=${s.latency}ms errors=${s.failed}`);toast(`نمونه ${index+1} · ${s.latency}ms`);render()}
function labHealth(){if(!labAvailable()){lab.data.healthResult=503;toast('HEALTH 503',true)}else{lab.data.healthResult=200;lab.data.healthChecked=true;labEvent('GET /api/health -> 200, SQLite SELECT 1; HTTP 5xx traffic tracked separately');toast('HEALTH 200 · مستقل از خطاهای ساختگی')}render()}
function labAccess(kind){const m=lab.data;if(!labAvailable()){toast('سرور در دسترس نیست',true);return}if(kind==='ok'){m.access.good=true;labEvent('GET /internal/metrics, private network + bearer -> 200');toast('INTERNAL + TOKEN → 200')}else if(kind==='no'){m.access.noToken=true;labEvent('GET /internal/metrics private without token -> 401');toast('بدون توکن → 401',true)}else{m.access.public=true;labEvent('GET /internal/metrics from public internet -> 403');toast('دسترسی عمومی → 403',true)}render()}
function labChart(){const m=lab.data,pts=m.samples.slice(-8),gp=$('labGraphPoints');gp.replaceChildren();if(!pts.length){$('labLine').setAttribute('d','');$('labArea').setAttribute('d','');$('labPointInfo').textContent='ابتدا چند آزمایش انجام بده';return}let min=0,max=Math.max(420,...pts.map(p=>p.latency))*1.12;let xy=pts.map((p,i)=>[pts.length===1?200:60+284*i/(pts.length-1),284-112*p.latency/max,p]);const d=xy.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');$('labLine').setAttribute('d',d);$('labArea').setAttribute('d',d+` L${xy.at(-1)[0]} 290 L${xy[0][0]} 290 Z`);const offset=m.samples.length-pts.length;xy.forEach(([x,y,p],i)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','g');e.setAttribute('class','scope-point');e.setAttribute('data-lab','point-'+(i+offset));e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label',`نمونه ${i+offset+1}: ${p.latency} میلی‌ثانیه، بار ${p.load}`);let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','17');c.setAttribute('fill','transparent');e.appendChild(c);c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',m.point===i+offset?'8':'6');c.setAttribute('fill',p.failed?'#c86678':'#5b7fd2');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','2');e.appendChild(c);gp.appendChild(e)});const p=m.samples[m.point]||m.samples.at(-1);$('labPointInfo').textContent=`LOAD ${p.load} · ${p.latency}ms · 5XX +${p.failed}`;}
function labSync(){const m=lab.data;$('labHttp').textContent=m.http;$('labErrors').textContent=m.errors;$('labLatency').textContent=m.samples.length?m.latency+'ms':'—';labUpdateSlider();$('labWsTile').setAttribute('fill',m.wsOpen?'#e6f9f1':'#fff');$('labWsTile').setAttribute('stroke',m.wsOpen?'#5fc7a5':'#dbe6f2');$('labWsLed').setAttribute('fill',m.wsOpen?'#32b88e':'#b6c4d5');$('labWsState').textContent=m.wsOpen?'OPEN':'OFF';$('labScopeHint').textContent=m.samples.length+' SAMPLES';$('labHealthCode').textContent=m.healthResult?'HTTP '+m.healthResult:'TEST ↗';const n=m.access;const pairs=[['labAuthTile','labAccessOk',n.good,'200'],['labNoTile','labAccessNo',n.noToken,'401'],['labPublicTile','labAccessPublic',n.public,'403']];for(const [tile,textEl,seen,code] of pairs){$(tile).setAttribute('fill',seen?'#eaf7f0':'#fff');$(tile).setAttribute('stroke',seen?'#80cbb1':'#dce6f1');$(textEl).textContent=seen?code:'TEST';$(textEl).setAttribute('fill',seen?'#279073':'#5b78a5')}labChart();$('labPill').textContent=m.won?'Metrics · LAB CLEARED':m.scope?'Metrics · Data Inspector':'Metrics · Experiment Lab';}
function labHelp(){const p=lab.data.hint++%3,steps=['بار 1 را امتحان کن؛ سپس بار 8 را بفرست و تفاوت زمان پاسخ را ببین.','برای تولید خطا روی 500 بزن. بعد داده‌ها را بزرگ‌نمایی کن و دو نقطه با بار متفاوت را لمس کن.','Health Check فقط سلامت سرویس را بررسی می‌کند؛ همیشه تعداد 5XX را نشان نمی‌دهد. اطلاعات Metrics باید خصوصی و با توکن قابل‌خواندن باشد.'];labSave();openSheet('راهنمای آزمایشگاه '+(p+1),`<p>${steps[p]}</p>`)}

function netDetails(){const n=network.data;const last=n.resultLast;const log=n.events.slice(-8).reverse().join('\n');openSheet('پشت صحنهٔ درخواست',`<p>${last?escapeHTML(last.reason):'یک درخواست WEB، API یا LIVE بفرست تا روند آن قابل بررسی شود.'}</p><pre>DNS: ${n.dns?'RESOLVED':'MISSING'}\nTLS: ${n.tls?'VALID':'INACTIVE'}\nWEB / → ${n.routes.web??'-'}\nAPI /api/ → ${n.routes.api??'-'}\nLIVE /ws → ${n.routes.ws??'-'}\nWS UPGRADE: ${n.upgrade?'ON':'OFF'}\nLAST: ${last?last.code:'NOT TESTED'}\nTARGET: app:8000</pre><pre>${escapeHTML(log||'No events yet')}</pre><p>آموزش: ${n.mastered?'تکمیل‌شده':'در حال انجام'}</p><p>تمام پاسخ‌ها آزمایشی‌اند؛ هیچ درخواستی به سرور واقعی ارسال نمی‌شود.</p>`)}

function onAction(name){if(game.busy)return;
 switch(name){
 case 'enter':switchScene('workshop');break;
 case 'image':
  if(phase()!=='image')return;
  game.selectedTool=game.selectedTool==='image'?null:'image';markBay(!!game.selectedTool);$('touchPrompt').style.display=game.selectedTool?'flex':'none';toast(game.selectedTool?'حالا محفظهٔ Docker را لمس کن':'انتخاب لغو شد');break;
 case 'record':
  if(phase()!=='record')return;
  game.selectedTool=game.selectedTool==='record'?null:'record';markBay(!!game.selectedTool);$('touchPrompt').style.display=game.selectedTool?'flex':'none';toast(game.selectedTool?'دادهٔ 01 را داخل HELIX بفرست':'انتخاب لغو شد');break;
 case 'bay':
  if(game.selectedTool==='image')sendToBay();
  else if(game.selectedTool==='record')saveRecord();
  else toast('ابتدا بستهٔ مرتبط را انتخاب کن');
  break;
 case 'temp':selectDisk('temporary');break;
 case 'perm':selectDisk('persistent');break;
 case 'initdb':initDb();break;
 case 'power':startApp();break;
 case 'health':checkHealth();break;
 case 'recreate':recreate();break;
 case 'verify':verifyData();break;
 }
}
function markBay(yes){$('bayOutline').setAttribute('stroke',yes?'#456dde':'#b9ccec');$('bayOutline').setAttribute('stroke-width',yes?'4':'2')}
function animateTraffic(kind){const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','8');dot.setAttribute('fill',kind==='record'?'#5cad9b':'#5a83cf');dot.setAttribute('opacity','.95');dot.setAttribute('cx',kind==='record'?'84':'313');dot.setAttribute('cy',kind==='record'?'410':'213');$('stage').appendChild(dot);const path=kind==='record'?[[84,410],[142,300],[193,281],[255,342]]:[[313,213],[235,228],[174,259],[247,276],[314,213]];let start=now(),duration=450;function draw(t){let k=Math.min(1,(t-start)/duration)*(path.length-1),i=Math.min(path.length-2,Math.floor(k)),v=k-i;dot.setAttribute('cx',String(path[i][0]+(path[i+1][0]-path[i][0])*v));dot.setAttribute('cy',String(path[i][1]+(path[i+1][1]-path[i][1])*v));if(k<path.length-1)requestAnimationFrame(draw);else dot.remove()}requestAnimationFrame(draw)}
function openSheet(title,html){$('sheet-title').textContent=title;$('sheet-body').innerHTML=html;$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');$('closeSheet').focus()}
function closeSheet(){if(!$('sheet').classList.contains('open'))return;$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')}
function showHelp(){if(game.scene==='grafana'){gfHelp();return}if(game.scene==='prometheus'){pHelp();return}if(game.scene==='metrics'){labHelp();return}if(game.scene==='network'){netHelp();return}if(game.scene==='hub'){openSheet('شروع بازی','<p>سرور سه‌بعدی را لمس کن. کارگاه Docker باز می‌شود و می‌توانی بستهٔ HELIX و فضای داده را خودت مدیریت کنی.</p>');return}const p=phase();const hints={
 image:['بستهٔ آبی HELIX را پیدا کن.','بسته را لمس کن، سپس قسمت روشن روی سرور را لمس کن.','Docker محیط اجرای برنامه را فراهم می‌کند.'],
 storage:['باید برای فایل دیتابیس جا پیدا کنی.','به TEMP و VOLUME نگاه کن؛ هر دو قابل انتخاب‌اند.','دادهٔ دائمی باید بیرون از فایل‌سیستم موقتی کانتینر باشد.'],
 db:['دیسک وصل است، ولی هنوز دیتابیسی ساخته نشده.','دایرهٔ آبی کنار سرور را لمس کن.','ساخت دیتابیس خالی در این آزمایش جدا از اجرای معمول برنامه است.'],
 power:['حالا برنامه آمادهٔ روشن‌شدن است.','علامت Power نزدیک سرور را لمس کن.','روشن بودن کانتینر با سالم بودن برنامه یکسان نیست.'],
 health:['آیا پایگاه‌داده پاسخ می‌دهد؟','نماد نبض کنار سرور را لمس کن.','در HELIX، /api/health یک پرس‌وجوی SELECT 1 را نیز انجام می‌دهد.'],
 record:['برای آزمون Storage باید داده‌ای ذخیره کنیم.','کارت 01 را لمس کن یا به داخل HELIX بکش.','یک رکورد آزمایشی در SQLite نوشته می‌شود.'],
 recreate:['باید ببینیم پس از جایگزینی کانتینر چه می‌ماند.','دکمهٔ دایره‌ای Rebuild را لمس کن.','تعویض کانتینر نباید دادهٔ ذخیره‌شده در Volume را حذف کند.'],
 'post-health':['کانتینر جدید نیاز به تست تازه دارد.','علامت نبض را دوباره لمس کن.','سلامت تأییدشدهٔ کانتینر قبلی برای کانتینر جدید معتبر نیست.'],
 verify:['اکنون اطلاعات قبلی را جست‌وجو کن.','دیسک سبز با عدد 01 را لمس کن.','اگر رکورد پیدا شود، ماندگاری واقعی‌نما اثبات شده است.'],
 lost:['داده داخل فضای موقت نگه‌داری شده بود.','Volume سبز را انتخاب کن و مأموریت را دوباره امتحان کن.','در HELIX واقعی SQLite داخل مسیر /data جدا از فایل‌سیستم کانتینر قرار دارد.'],
 win:['کارگاه Docker تکمیل شد.','می‌توانی به سرور برگردی یا آزمایش را تکرار کنی.','وضعیت قبولی آموزشی از سلامت جاری برنامه جداست.']
};const a=hints[p]||hints.image;game.data.hintTier=Math.min(3,game.data.hintTier+1);const n=game.data.hintTier;openSheet('راهنمای ' + n,`<p>${a[n-1]}</p><div class="symbol-row"><b>${guidance[p][2]}</b><span>${guidance[p][0]}</span></div>`)}
function showDetails(){if(game.scene==='grafana'){gfDetails();return}if(game.scene==='prometheus'){pDetails();return}if(game.scene==='metrics'){labDetails();return}if(game.scene==='network'){netDetails();return}if(game.scene==='hub'){openSheet('دنیای HELIX','<p>چهار تجربهٔ Docker، Nginx، Metrics و Prometheus به یک سرور مشترک متصل‌اند.</p><p>تمام عملیات آفلاین و شبیه‌سازی‌شده‌اند.</p>');return}const s=game.data;const lines=s.events.slice(-11).reverse().map(t=>'• '+t).join('\n');openSheet('پشت صحنه',`<p>وضعیت شبیه‌ساز (نه سرور واقعی)</p><pre>APP : ${s.running?'RUNNING':'STOPPED'}\nIMAGE : ${s.image?'READY':'NONE'}\nDATABASE : ${s.db?'READY':'NONE'}\nSTORAGE : ${s.storage==='persistent'?'PERSISTENT':s.storage==='temporary'?'TEMPORARY':'NONE'}\nHEALTH : ${s.healthy?'HTTP 200':'NOT VERIFIED'}\nPORT : 8000 (private)</pre><p>رویدادهای اخیر</p><pre>${escapeHTML(lines||'No simulated operations yet.')}</pre><button class="pillbtn secondary" id="restartAsk" style="width:100%">شروع دوبارهٔ کارگاه ↻</button>`)}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function resetPrompt(){openSheet('شروع دوباره؟','<p>فقط پیشرفت آزمایشی Docker Workshop از نو آغاز می‌شود.</p><button class="pillbtn primary" id="confirmReset" style="width:100%">شروع مجدد آزمایش</button>')}
function resetData(){game.data=BASE();safe.save(game.data);game.pendingDrag=null;game.selectedTool=null;markBay(false);closeSheet();render();toast('کارگاه از نو آماده شد')}
// Unified tap/drag engine. Individual minigames implement only action callbacks.
const controls={
 init(){const ev=$('stage');ev.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-hit]');if(game.busy)return;const id=t?.dataset.hit||((game.selectedTool&&hitAt(e.clientX,e.clientY)==='bay')?'bay':null);if(!id)return;game.pendingDrag={id,from:{x:e.clientX,y:e.clientY},moved:false,pointer:e.pointerId};if(id==='image'||id==='record'){ev.setPointerCapture?.(e.pointerId)} });
 ev.addEventListener('pointermove',e=>{let d=game.pendingDrag;if(!d||d.pointer!==e.pointerId)return;let delta=Math.hypot(e.clientX-d.from.x,e.clientY-d.from.y);if(delta>12)d.moved=true;if(!d.moved)return;if(d.id!=='image'&&d.id!=='record')return;const g=$('drag-ghost');g.classList.add('show');g.textContent=d.id==='record'?'01':'H';g.style.left=(e.clientX-document.querySelector('#app').getBoundingClientRect().left)+'px';g.style.top=(e.clientY-document.querySelector('#app').getBoundingClientRect().top)+'px'});
 ev.addEventListener('pointerup',e=>{const d=game.pendingDrag;if(!d||d.pointer!==e.pointerId)return;game.pendingDrag=null;$('drag-ghost').classList.remove('show');if(d.moved&&(d.id==='image'||d.id==='record')){const k=hitAt(e.clientX,e.clientY);if(d.id==='image'&&k==='bay')sendToBay();else if(d.id==='record'&&k==='bay')saveRecord();else{toast('بسته را داخل HELIX رها کن');markBay(false)}return}onAction(d.id)});
 ev.addEventListener('pointercancel',()=>{$('drag-ghost').classList.remove('show');game.pendingDrag=null});
 ev.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-hit]')){e.preventDefault();onAction(e.target.closest('[data-hit]').dataset.hit)}});
 $('worldSvg').addEventListener('click',e=>{const t=e.target.closest('[data-hit]');if(t?.dataset.hit==='enter')switchScene('workshop');else if(t?.dataset.hit==='network-enter')switchScene('network');else if(t?.dataset.hit==='metrics-enter')switchScene('metrics');else if(t?.dataset.hit==='prom-enter')switchScene('prometheus');else if(t?.dataset.hit==='graf-enter')switchScene('grafana')});$('worldSvg').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-hit]')){e.preventDefault();switchScene(e.target.closest('[data-hit]').dataset.hit==='graf-enter'?'grafana':e.target.closest('[data-hit]').dataset.hit==='prom-enter'?'prometheus':e.target.closest('[data-hit]').dataset.hit==='metrics-enter'?'metrics':e.target.closest('[data-hit]').dataset.hit==='network-enter'?'network':'workshop')}});
 $('networkSvg').addEventListener('click',e=>{const hit=e.target.closest('[data-net]')?.dataset.net;if(!hit||game.scene!=='network')return;if(hit.startsWith('test-'))netProbe(hit.slice(5));else netConfigure(hit)});
 $('networkSvg').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&game.scene==='network'){const hit=e.target.closest('[data-net]')?.dataset.net;if(!hit)return;e.preventDefault();if(hit.startsWith('test-'))netProbe(hit.slice(5));else netConfigure(hit)}});

 const lv=$('labSvg');
 lv.addEventListener('pointerdown',e=>{if(game.scene!=='metrics')return;const t=e.target.closest('[data-lab]');if(t?.dataset.lab!=='load')return;lab.slider={pointer:e.pointerId,from:e.clientX,moved:false};lv.setPointerCapture?.(e.pointerId);labSetFromX(e);labSync();});
 lv.addEventListener('pointermove',e=>{if(!lab.slider||lab.slider.pointer!==e.pointerId)return;if(Math.abs(e.clientX-lab.slider.from)>6)lab.slider.moved=true;labSetFromX(e);labUpdateSlider();});
 lv.addEventListener('pointerup',e=>{if(lab.slider?.pointer!==e.pointerId)return;lab.slider=null;labSave();lv.releasePointerCapture?.(e.pointerId);render();});
 lv.addEventListener('pointercancel',()=>{lab.slider=null});
 lv.addEventListener('click',e=>{const id=e.target.closest('[data-lab]')?.dataset.lab;if(!id||game.scene!=='metrics'||id==='load')return;labAction(id)});
 lv.addEventListener('keydown',e=>{const el=e.target.closest('[data-lab]');if(!el||game.scene!=='metrics')return;const id=el.dataset.lab;if(id==='load'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const vals=[1,4,8];let i=vals.indexOf(lab.data.load);if(e.key==='ArrowLeft')i=Math.max(0,i-1);else if(e.key==='ArrowRight')i=Math.min(2,i+1);else if(e.key==='Home')i=0;else i=2;labSetLoad(vals[i]);render();return}if(e.key==='Enter'||e.key===' '){e.preventDefault();if(id!=='load')labAction(id)}});
 const gv=$('gfSvg');gv.addEventListener('click',e=>{const h=e.target.closest('[data-gf]');if(h&&game.scene==='grafana')gfTap(h.dataset.gf)});gv.addEventListener('keydown',e=>{const h=e.target.closest('[data-gf]');if(h&&game.scene==='grafana'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gfTap(h.dataset.gf)}});
 const pv=$('promSvg');
 pv.addEventListener('click',e=>{const k=e.target.closest('[data-prom]')?.dataset.prom;if(k&&game.scene==='prometheus')pTap(k)});
 pv.addEventListener('keydown',e=>{const el=e.target.closest('[data-prom]');if(!el||game.scene!=='prometheus')return;if(e.key==='Enter'||e.key===' '){e.preventDefault();pTap(el.dataset.prom)}});
 $('back').onclick=()=>switchScene('hub');$('hint').onclick=showHelp;$('details').onclick=showDetails;
 $('dock-controls').addEventListener('click',e=>{const c=e.target.closest('[data-control]')?.dataset.control;if(c==='enter'||c==='docker')switchScene('workshop');if(c==='network')switchScene('network');if(c==='metrics')switchScene('metrics');if(c==='prometheus')switchScene('prometheus');if(c==='grafana')switchScene('grafana');if(c==='help')showHelp();if(c==='inspect')showDetails();if(c==='replay')resetPrompt()});
 $('peek').onclick=showDetails;$('closeSheet').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();if(e.target.id==='confirmReset')resetData();if(e.target.id==='restartAsk')resetPrompt();if(e.target.id==='labResetAsk')openSheet('شروع دوبارهٔ Metrics؟','<p>فقط داده‌های آزمایشگاه پاک می‌شوند؛ Docker و Nginx حفظ خواهند شد.</p><button class="pillbtn primary" id="confirmLabReset" style="width:100%">شروع مجدد</button>');if(e.target.id==='confirmLabReset')labReset();if(e.target.id==='pResetAsk')openSheet('شروع مجدد Prometheus؟','<p>فقط داده‌های جمع‌آوری‌شدهٔ این بازی پاک می‌شوند.</p><button class="pillbtn primary" id="pResetYes">شروع دوباره</button>');if(e.target.id==='pResetYes')pReset()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
 },
};
function hitAt(x,y){const svg=$('stage'),point=svg.createSVGPoint();point.x=x;point.y=y;const m=svg.getScreenCTM();if(!m)return null;const q=point.matrixTransform(m.inverse());if(q.x>=106&&q.x<=205&&q.y>=185&&q.y<=319)return 'bay';return null}
controls.init();render();
// Long-press reset only on the explicit help sheet, never on ordinary swipe gestures.
$('details').addEventListener('contextmenu',e=>{e.preventDefault();resetPrompt()});
window.addEventListener('pageshow',render);
})();
