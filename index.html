 if(s.focus==='app')return `<div class="actions">${!s.db?`<button class="button" data-action="bootstrap">آماده‌کردن SQLite خالی</button>`:''}${!s.running?`<button class="button primary" data-action="start">روشن کردن کانتینر</button>`:`<button class="button" data-action="stop">خاموش کردن کانتینر</button>`}${s.running?`<button class="button" data-action="recreate">بازسازی کانتینر</button>`:''}${s.running?`<button class="button" data-action="write">ثبت دادهٔ آزمایشی</button>`:''}${s.generation>=2?`<button class="button good" data-action="verify-data">بررسی ماندگاری داده</button>`:''}</div>`;

function nextGoal(){if(s.mission==='security')return securityGoal();if(s.mission==='grafana')return grafGoal();if(['metrics','prometheus'].includes(s.mission))return monitorGoal();if(s.mission==='docker'){
 if(!s.image)return 'بستهٔ HELIX Image را از نوار ابزار به VPS بکش یا آن را انتخاب کن و روی سرور بزن.';

 if(!s.running)return 'از خود گره HELIX App، کانتینر را روشن کن.';
 if(!s.checks.health)return 'از ابزار Health Probe استفاده کن و آن را روی HELIX App قرار بده.';

 if(s.generation<2)return 'کانتینر را از داخل HELIX App بازسازی کن، نه اینکه داده‌ها را پاک کنی.';

 }
 if(!s.dns)return 'Domain / DNS را روی Browser قرار بده و نام دامنه را متصل کن.';

 if(!nginxDone())return 'Browser را انتخاب کن و چهار تست وب، API، WebSocket و مسیر خصوصی را انجام بده.';

 if(a.edge&&a.native&&r.role==='viewer'&&target==='grafana'&&a.edgeSession&&!a.grafSession&&r.code==='HTTP 401')a.stageNativeDenied=true;
 if(a.edge&&a.native&&a.stageNativeDenied&&r.role==='viewer'&&target==='grafana'&&a.edgeSession&&a.grafSession&&r.code==='HTTP 200')p.edgeThenNative=true;
 if(a.viewer&&a.edge&&a.native&&r.role==='viewer'&&a.edgeSession&&a.grafSession&&target==='grafana'&&r.code==='HTTP 200')p.viewerView=true;
 if(a.viewer&&r.role==='viewer'&&target==='edit'&&a.edgeSession&&a.grafSession&&r.code==='HTTP 403')p.viewerEdit=true;
 if(a.admin&&r.role==='viewer'&&target==='prom'&&a.edgeSession&&r.code==='HTTP 401')p.viewerProm=true;
 if(a.admin&&r.role==='admin'&&target==='prom'&&a.edgeSession&&r.code==='HTTP 200')p.adminProm=true;
 if(target==='raw'&&r.code==='HTTP 404')p.rawMetrics=true;
 if(a.proxy&&r.role==='viewer'&&a.edgeSession&&a.grafSession&&target==='proxy'&&r.code==='HTTP 404')p.proxyBypass=true;
 s.focus='tester';addLog(`${r.role}: ${target} -> ${r.code} (${r.chain})`,r.allowed?'ok':'warn');save();render();notify(`${r.code} — ${r.title}`,r.risk?'bad':r.secure||r.allowed?'ok':'info');}
function secInvalidate(which){const p=s.security.proof;if(which==='edge'||which==='native'){p.anonymous=false;p.edgeThenNative=false;p.viewerView=false;p.viewerEdit=false;p.viewerProm=false;p.adminProm=false;p.proxyBypass=false;s.security.stageNativeDenied=false;}if(which==='viewer'){p.viewerView=false;p.viewerEdit=false;}if(which==='admin'){p.viewerProm=false;p.adminProm=false;}if(which==='proxy'){p.proxyBypass=false;}}
function securityAction(x){const a=s.security;
 if(x==='s-sign-edge'){if(a.role==='anonymous')return notify('Anonymous بدون اعتبارنامه نمی‌تواند وارد شود.','bad'),true;if(!a.edge)return notify('ابتدا Edge Login را روی Nginx Gate فعال کن.','bad'),true;a.edgeSession=true;a.grafSession=false;a.last=null;s.focus='tester';say(`${a.role}: ورود آزمایشی Edge انجام شد. این ورود هنوز نشست Grafana نیست.`,'ok');return true;}
 if(x==='s-sign-graf'){if(a.role==='anonymous'||!a.edgeSession)return notify('اول با یک هویت معتبر از Edge عبور کن.','bad'),true;if(!a.native)return notify('ورود مستقل Grafana هنوز تنظیم نشده است.','bad'),true;a.grafSession=true;a.last=null;s.focus='tester';say(`${a.role}: نشست مستقل Grafana فعال شد (شبیه‌سازی).`,'ok');return true;}
 if(x==='s-sign-out'){a.edgeSession=false;a.grafSession=false;a.last=null;s.focus='tester';say('هر دو نشست مرورگر آزمایشی پاک شدند.');return true;}
 if(x==='s-test'){secTest();return true;}
 if(x==='s-raw-test'){secTest('raw');return true;}
 if(x==='s-close-raw'){s.monitor.publicExposure=false;s.monitor.checkedPublic=false;return say('دسترسی عمومی به Metrics دوباره بسته شد. اکنون تست خام را اجرا کن.','ok'),true;}
 if(x==='s-show-proof'){const got=securityMilestones();notify(`شواهد امنیتی: ${got.filter(z=>z.done).length} از ${got.length} مورد تأیید شده‌اند.`);return true;}
 const changes={'s-disable-edge':'edge','s-disable-native':'native','s-disable-viewer':'viewer','s-disable-admin':'admin'};
 if(changes[x]){a[changes[x]]=false;a.last=null;secInvalidate(changes[x]);if(x==='s-disable-edge'||x==='s-disable-native'){a.edgeSession=false;a.grafSession=false;}say('یکی از کنترل‌های امنیتی در شبیه‌ساز غیرفعال شد. درخواست را دوباره آزمایش کن.','warn');return true;}
 return false;}
function securityHint(){const i=s.hints.security||0;const tips=[
 'امنیت را مثل دو درِ جدا تصور کن: یک در در Nginx و یک در داخل Grafana. پس از عبور از درها، نقش Viewer و Admin مشخص می‌کند چه چیزی مجاز است.',
 'ابزارها را روی گره‌های مناسب قرار بده، سپس Anonymous، Viewer و Admin را یکی‌یکی در Test Browser انتخاب کن؛ ورود Edge و Grafana مستقل‌اند.',
 'Edge Login → Nginx، Grafana Login/Viewer Policy → Grafana، Admin-only → Prometheus و Datasource Shield → Nginx. سپس مسیرهای Grafana، Edit، Prometheus، Raw Metrics و Datasource Proxy را با نقش‌های مختلف امتحان کن.'
 ];return tips[Math.min(i,2)]+'\n\nهدف فعلی: '+securityGoal();}
document.addEventListener('change',e=>{if(e.target.matches('[id=secRouteSelect]')){s.security.target=e.target.value;s.security.last=null;save();render();}});
document.addEventListener('click',e=>{const role=e.target.closest('[data-sec-role]');if(role){selectSecurityRole(role.dataset.secRole);return}const t=e.target.closest('[data-sec-target]');if(t){s.security.target=t.dataset.secTarget;s.security.last=null;save();render();return}});

/* Selection controls are deliberate user interactions, independent from pre-scripted lesson steps. */
document.addEventListener('click',e=>{const cp=e.target.closest('[data-chart-point]');if(cp){notify(`نمونهٔ t=${cp.dataset.time}s · مقدار=${cp.dataset.value} ${s.monitor.graf.panel?grafMetrics[s.monitor.graf.panel.metric].unit:''}`,'ok');return}const m=e.target.closest('[data-graf-metric]');if(m){grafSelect('metric',m.dataset.grafMetric);return}const v=e.target.closest('[data-graf-viz]');if(v){grafSelect('viz',v.dataset.grafViz);return}const w=e.target.closest('[data-graf-window]');if(w){grafSelect('window',w.dataset.grafWindow);return}});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-chart-point]')){e.preventDefault();e.target.click()}});
addLog('Training sandbox loaded. No live infrastructure access.');render();
})();
