function networkProbe(which){

 else if(!n.tls){where='tls';code='TLS';label='گواهی امن نیست'}
 else if(!n.routes[which]){where='nginx';code='404';label='مسیر تعریف نشده'}
 else if(n.routes[which]!=='18000'){where='app';code='502';label='پورت اشتباه'}
 else if(!s.running||!s.db||!s.healthy){where='app';code='502';label='HELIX آماده نیست'}

 n.last={id:which,where,code,label,ok};n.tests[which]=ok;n.firstPacket=true;

 if(n.tests.web&&n.tests.api&&n.tests.ws&&!n.won){n.won=true;netLog('Nginx/DNS/TLS/routes/WSS: all verified [simulated]');notify('سه درخواست موفق! سایت آنلاین شد ✦','ok')}
 render()
}

function metTarget(id){

  if(!metLive()){metLog('traffic blocked: upstream/web edge unavailable');notify('HELIX آنلاین نیست؛ Nginx را بررسی کن','error');return}
  if(id==='traffic-ws'){m.ws=m.ws?0:1;m.wsEver=true;m.last={kind:'traffic',ok:true};metLog('websocket '+(m.ws?'connected':'disconnected')+' [simulated]');notify(m.ws?'WS · وصل شد':'WS · قطع شد','ok');}
  else{const bad=id==='traffic-error';m.http++;m[bad?'errors':'ok']++;m.events.push({id:m.http,code:bad?500:200,ms:bad?640:85+((m.http*37)%95)});m.events=m.events.slice(-16);m.last={kind:'traffic',ok:!bad};metLog(`GET /lab/${bad?'failure':'success'} -> ${bad?500:200} [synthetic event]`);notify(bad?'500 · خطای ساختگی':'200 · درخواست سالم',bad?'error':'ok')}

 }

 if(id==='meter-socket'){
  if(!metTrafficReady()){notify('اول درخواست سالم، خطا و WS را امتحان کن');return}
  if(m.mounted){notify('متریک از قبل نصب است','ok');return}
  if(m.selected!=='module'){notify('اول بسته METRICS را انتخاب کن');return}
  m.mounted=true;m.selected=null;metLog('metrics instrument exposed inside app (simulated)');notify('اعداد داخلی قابل مشاهده شدند','ok');render();return;
 }
 if(id==='meter'){
  if(!m.mounted){notify('METRICS هنوز راه‌اندازی نشده');return}
  m.viewed=true;metLog(`metrics preview http=${m.http} 5xx=${m.errors} websocket=${m.ws} last_ms=${m.events.length?m.events.at(-1).ms:'none'}`);
  notify(`HTTP ${m.http} · 5XX ${m.errors} · LAST ${m.events.at(-1)?.ms??'–'}ms`,'ok');render();return;
 }
 if(id==='key-chip'){if(!m.viewed){notify('ابتدا شمارنده‌ها را لمس کن');return}m.selected=m.selected==='token'?null:'token';notify(m.selected?'کلید را روی قفل بگذار':'انتخاب لغو شد');render();return}
 if(id==='key-socket'){
  if(!m.viewed){notify('اول شمارنده‌ها را ببین');return}
  if(m.token){m.token=false;metResetProbes();metLog('metrics bearer token removed [simulated]');notify('کلید حذف شد؛ حالا بدون کلید امتحان کن','error');render();return}
  if(m.selected!=='token'){notify('کلید را انتخاب کن');return}m.token=true;m.selected=null;metResetProbes();metLog('METRICS_TOKEN_FILE configured (private, synthetic credential)');notify('ورودی متریک محافظت شد','ok');render();return;
 }
 if(['probe-private','probe-guest','probe-public'].includes(id)){metProbe(id);return}
}
function metProbe(id){
 if(!m.mounted){notify('اول متریک را به HELIX وصل کن');return}
 let code=404,label='مسدود',allow=false;
 if(id==='probe-private'){
  allow=metProtected();code=allow?200:404;label=allow?'متریک داخلی':'کلید نامعتبر';if(allow)m.internalOk=true;
 }else if(id==='probe-guest'){
  code=404;label='بدون توکن';if(m.token)m.internalDenied=true;
 }else{
  if(!metLive()){code='OFF';label='شبکه قطع است';}
  else {code=404;label='مسیر عمومی بسته';if(m.token)m.publicDenied=true;}
 }
 m.last={kind:'probe',code,label};metLog((id==='probe-private'?'INTERNAL+TOKEN':id==='probe-guest'?'INTERNAL+ANON':'PUBLIC')+` -> ${code} [simulated]`);
 if(id==='probe-private'&&code!==200)m.mistakes++;
 notify(`${code} · ${label}`,code===200?'ok':code==='OFF'?'error':'normal');
 if(m.internalOk&&m.internalDenied&&m.publicDenied&&!m.won){m.won=true;metLog('quest completed: observed traffic and verified private-only metrics');notify('METRICS خصوصی و سالم است!','ok')}
 render();
}

function metMove(e){if(!metricDrag)return;const p=clientPoint(e);if(!p||!metricDrag.origin)return;
 metricDrag.moved ||= Math.hypot(p.x-metricDrag.origin.x,p.y-metricDrag.origin.y)>11;
 if(metricDrag.moved&&['metrics-module','key-chip'].includes(metricDrag.id)){let g=E('metGhost');if(!g){g=document.createElementNS(svgNs,'g');g.id='metGhost';g.style.pointerEvents='none';g.innerHTML='<circle r="25" fill="#547cdc" fill-opacity=".16" stroke="#547cdc" stroke-width="2" stroke-dasharray="5 5"/><text text-anchor="middle" y="4" font-size="11" fill="#466ab5" font-weight="900">MOVE</text>';els.scene.appendChild(g)}g.setAttribute('transform',`translate(${p.x},${p.y})`)}
}
function metUp(e){if(!metricDrag)return;let d=metricDrag;metricDrag=null;E('metGhost')?.remove();const p=clientPoint(e);
 if(d.moved&&p&&d.id==='metrics-module'&&p.x>255&&p.x<413&&p.y>262&&p.y<365){m.selected='module';metTarget('meter-socket');return}
 if(d.moved&&p&&d.id==='key-chip'&&p.x>265&&p.x<404&&p.y>267&&p.y<357){m.selected='token';metTarget('key-socket');return}
 if(!d.moved){metTarget(d.id);return}notify('قطعه را روی جایگاه مناسب رها کن');
}

function checkdata(){if(!s.restarted){notify('ابتدا کانتینر را بازسازی کن');return}if(!s.healthy){notify('اول سلامت برنامه را بررسی کن');return}if(s.sample===1&&s.storage==='persistent'){s.inspected=true;s.won=true;log('persistent record verified after recreation; quest passed');notify('داده محفوظ ماند!','ok');render();openSheet('مرحلهٔ اول کامل شد ✦','<p>داده پس از بازسازی کانتینر باقی ماند.</p><button class="closeAction" id="enterNetworkQuest">ورود به مرحلهٔ بعد: Nginx ←</button>');return}fail('داده پیدا نشد؛ فضای ذخیره‌سازی را بررسی کن')}
function fail(msg){s.mistakes++;notify(msg,'error');log('LAB CHECK: '+msg)}
function target(id){if(quest===5){grafTarget(id);return}if(quest===4){promTarget(id);return}if(quest===3){metTarget(id);return}if(quest===2){networkTarget(id);return} if(id==='crate'){if(s.image)return;s.selected=!s.selected;notify(s.selected?'بسته انتخاب شد؛ Docker را لمس کن':'انتخاب لغو شد');render();return}if(id==='rack'){install();return}if(id==='persistent'||id==='temporary'){if(s.restarted&&s.running&&s.healthy&&id===s.storage){checkdata();return}if(s.restarted&&s.running&&id===s.storage){notify('اول سلامت را مجدداً بررسی کن');return}setStorage(id);return}if(id==='power'){power();return}if(id==='probe'){probe();return}if(id==='record'){record();return}if(id==='recreate'){recreate();return}}
function act(id){switch(id){case 'nextgraf':setQuest(5);break;case 'backprom':setQuest(4);break;case 'nextprom':setQuest(4);break;case 'backmetrics':setQuest(3);break;case 'nextmetrics':setQuest(3);break;case 'backnet':setQuest(2);break;case 'next':setQuest(2);break;case 'back':setQuest(1);break;case 'net-retest':networkRetest();break;case 'hint':help();break;case 'select':target('crate');break;case 'install':install();break;case 'persistent':setStorage('persistent');break;case 'temporary':setStorage('temporary');break;case 'initdb':initialize();break;case 'power':power();break;case 'probe':probe();break;case 'record':record();break;case 'recreate':recreate();break;case 'checkdata':checkdata();break;case 'storagehelp':openSheet('محل ذخیره',`<p>اگر دیتابیس داخل فضای موقت کانتینر باشد، با بازسازی کانتینر ممکن است حذف شود. دیسک دائمی از آن جداست.</p><small>می‌توانی عمداً فضای موقت را انتخاب کنی و نتیجه را آزمایش کنی.</small>`);break;case 'explain':openSheet('Docker چیست؟',`<p>Docker برنامه را همراه محیط موردنیازش در کانتینر اجرا می‌کند. کانتینر از هستهٔ میزبان استفاده می‌کند.</p><p>برای نصب، بستهٔ HELIX را انتخاب و محفظهٔ Docker را لمس کن.</p>`);break;case 'inspect':showTrace();break;case 'reset':reset();break}}
function openSheet(title,content){els.sheetTitle.textContent=title;els.sheetContent.innerHTML=content;els.sheet.classList.add('show');els.sheet.setAttribute('aria-hidden','false');E('sheetClose').focus()}
function closeSheet(){els.sheet.classList.remove('show');els.sheet.setAttribute('aria-hidden','true')}
function showTrace(){if(quest===5){grafTrace();return}if(quest===4){promTrace();return}if(quest===3){metTrace();return}if(quest===2){networkTrace();return} const lines=s.trace.length?s.trace.join('\n'):'No operations recorded yet.';openSheet('پشت صحنه',`<p>این گزارش فقط مربوط به شبیه‌ساز است؛ هیچ دستوری روی VPS واقعی اجرا نشده.</p><code>HELIX application: app :8000\nStorage: /data/smooth.db\nHealth: GET /api/health</code><div class="log"></div>`);els.sheetContent.querySelector('.log').textContent=lines}
function reset(){if(quest===5){grafReset();return}if(quest===4){promReset();return}if(quest===3){metReset();return}if(quest===2){networkReset();return} closeSheet();s=INITIAL();log('training simulation initialized');render();notify('سرور آزمایشی دوباره آماده شد')}
function help(){if(quest===5){grafHelp();return}if(quest===4){promHelp();return}if(quest===3){metHelp();return}if(quest===2){networkHelp();return} s.hint++;const x=stage();const info=[['کجا نصب کنم؟','بستهٔ HELIX پایین سمت چپ است؛ محفظهٔ Docker در جلوی سرور قرار دارد.'],['دو مخزن متفاوت','مخزن موقت سمت چپ است؛ دیسک دائمی سمت راست. اول امتحان کن کدام یک داده را حفظ می‌کند.'],['قدم بعدی','برای اولین اجرا، پایگاه‌دادهٔ خالی را آماده کن.'],['برق کانتینر','کلید دایره‌ای روی بدنهٔ سرور را لمس کن.'],['تست برنامه','علامت ضربان قلب بالای سمت راست سرور است.'],['دادهٔ نمونه','آیکون داده در گوشهٔ بالای صحنه قرار دارد.'],['بازسازی','نماد پیکان چرخان در بالای سمت چپ قرار دارد.'],['آزمون نهایی','پس از بازسازی، سلامت را دوباره آزمایش کن و مخزن را لمس کن.'],['تمام شد!','حالا می‌توانی دوباره آزمایش کنی و این بار فضای موقت را انتخاب کنی.']][x===9?8:x];openSheet(info[0],`<p>${info[1]}</p>`)}
function clientPoint(event){const matrix=els.scene.getScreenCTM();if(!matrix)return null;let p=els.scene.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(matrix.inverse())}
function hitFromPoint(pos){if(!pos)return null;const [x,y]=[pos.x,pos.y];if(x>=120&&x<=217&&y>=175&&y<=266)return 'rack';if(x>=275&&x<=396&&y>=281&&y<=389)return 'persistent';if(x>=18&&x<=110&&y>=192&&y<=273)return 'temporary';return null}
function worldPointerDown(e){if(quest===5){grafDown(e);return}if(quest===4){promDown(e);return}if(quest===3){metDown(e);return}if(quest===2){netPointerDown(e);return} const el=e.target.closest('[data-hit]');if(!el)return;const id=el.dataset.hit;if(id==='crate'&&!s.image){drag={origin:clientPoint(e),moved:false,target:id,ghost:null};els.scene.setPointerCapture?.(e.pointerId);return}if(id){drag={origin:clientPoint(e),moved:false,target:id,ghost:null};els.scene.setPointerCapture?.(e.pointerId)}}
function worldPointerMove(e){if(quest===5){grafMove(e);return}if(quest===4){promMove(e);return}if(quest===3){metMove(e);return}if(quest===2){netPointerMove(e);return} if(!drag)return;const p=clientPoint(e);if(!p||!drag.origin)return;const dist=Math.hypot(p.x-drag.origin.x,p.y-drag.origin.y);if(dist>11)drag.moved=true;if(drag.target==='crate'&&drag.moved){let g=E('dragGhost');if(!g){g=document.createElementNS(svgNs,'g');g.id='dragGhost';g.style.pointerEvents='none';g.innerHTML='<circle r="24" fill="#5c80d5" fill-opacity=".18" stroke="#658add" stroke-dasharray="5 4" stroke-width="2"/><text y="5" text-anchor="middle" font-size="15" font-weight="900" fill="#3e64c3" font-family="system-ui">H</text>';els.scene.appendChild(g)}g.setAttribute('transform',`translate(${p.x},${p.y})`)}}
function worldPointerUp(e){if(quest===5){grafUp(e);return}if(quest===4){promUp(e);return}if(quest===3){metUp(e);return}if(quest===2){netPointerUp(e);return} if(!drag)return;let d=drag;drag=null;const p=clientPoint(e);const ghost=E('dragGhost');ghost?.remove();const hit=hitFromPoint(p);if(d.target==='crate'&&d.moved){if(hit==='rack'){s.selected=true;install();return}notify('بسته را روی محفظهٔ Docker قرار بده');return}if(!d.moved){target(d.target)}else if(d.target!=='crate'&&hit){target(hit)} }
function worldPointerCancel(){if(quest===5){grafDrag=null;E('grafGhost')?.remove();return}if(quest===4){promDrag=null;E('promGhost')?.remove();return}if(quest===3){metricDrag=null;E('metGhost')?.remove();return}if(quest===2){netPointerCancel();return} drag=null;E('dragGhost')?.remove()}
// Delegated pointer and keyboard controls share the same game commands.
els.scene.addEventListener('pointerdown',worldPointerDown);
els.scene.addEventListener('pointermove',worldPointerMove);
els.scene.addEventListener('pointerup',worldPointerUp);
els.scene.addEventListener('pointercancel',worldPointerCancel);
els.scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-hit]');if(el){e.preventDefault();target(el.dataset.hit)}}});
els.actions.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});
E('helpButton').addEventListener('click',help);E('inspectButton').addEventListener('click',showTrace);E('resetButton').addEventListener('click',()=>openSheet('شروع دوباره؟','<p>فقط پیشرفت همین مأموریت آزمایشی پاک می‌شود.</p><button class="closeAction" id="confirmReset" style="background:#bd5363">شروع دوباره</button>'));
els.sheet.addEventListener('click',e=>{if(e.target===els.sheet)closeSheet();if(e.target?.id==='confirmReset')reset();if(e.target?.id==='enterNetworkQuest')setQuest(2)});
E('sheetClose').addEventListener('click',closeSheet);E('sheetDone').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('pageshow',()=>{render()});
render();
})();
</script>
